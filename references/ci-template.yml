## Go 项目

```yaml
name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v go >/dev/null 2>&1 || (echo "[runtime] go missing, installing" \
            && curl -fsSL https://go.dev/dl/go1.21.13.linux-amd64.tar.gz | tar -C /usr/local -xz \
            && export PATH=$PATH:/usr/local/go/bin)
          go version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go build ./...
      - run: go test ./...          # Go 内置测试，无测试包即 0 退出，语义与 --passWithNoTests 不同，不做条件生成

  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1 \
            || (echo "[runtime] node/npm missing, installing" \
                && (apt-get update -y && apt-get install -y nodejs npm \
                    || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
                        && apt-get install -y nodejs)))
          node -v && npm -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify.mjs                # 统一门禁入口（本地与 CI 同语义）
      - run: node scripts/check-constitution.mjs
```

> **Go 不再用 `make verify`**：本仓不生成 Makefile 模板，`make verify` 会指向一个不存在的目标。门禁 job 改用 `scripts/verify.mjs` —— Go 项目里 `verify.mjs` 是**零外部依赖**的（只读 `gates.json` 并执行 `run`），因此**不需要 `npm ci`、不需要 `setup-go`**，只要 `node` 存在即可；宿主若确实选了 Makefile，按项目实际路径替换 `run` 即可——**但必须确认该目标已被生成**。

