## Python 项目

```yaml
name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v python3 >/dev/null 2>&1 || (echo "[runtime] python3 missing, installing" \
            && apt-get update -y && apt-get install -y python3 python3-pip)
          python3 -V && python3 -m pip --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest ruff
      - run: ruff check .
      # ↓ test 步骤：仅在探测到 pytest 依赖或测试文件时生成（见文首规则 2）
      - run: pytest

  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v python3 >/dev/null 2>&1 || (echo "[runtime] python3 missing, installing" \
            && apt-get update -y && apt-get install -y python3 python3-pip)
          python3 -V && python3 -m pip --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py               # 统一门禁入口（本地与 CI 同语义）
      - run: python scripts/check-constitution.py
```

> **`scripts/verify.py` 是生成物，不是假设**。本模板选用 Python 宿主时，`references/gates-templates.md` §五 必须同步产出 `scripts/verify.py` 与 `scripts/check-constitution.py`（按 §二/§三 的 Node 版**等价移植**）。**宿主未被生成时不得引用它**——这是 G2 的"模板假设不存在的东西"缺陷，已在生成侧改为硬性要求。
> **`pytest` 零用例退出码 5**（非 0），故不需要也不允许 `--passWithNoTests`。

