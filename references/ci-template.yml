## 未探测到测试时的处理（**唯一需要手工判断的一步**）

四种语言的 workflow 中，test 步骤都已被**显式标记**：

```yaml
      # ↓ test 步骤：仅在 Step 1 探测到测试框架或测试文件时生成（见文首规则 2）
      - run: npm test        # Vue/React 为 pnpm test；Python 为 pytest；Go 见下
```

**按 Step 1 探测结果二选一**：

| 探测结果 | 动作 |
|----------|------|
| 探测到测试框架（`jest` / `vitest` / `mocha` / `pytest` …）**或**存在测试文件（`test/` `tests/` `__tests__/` `*.test.*` `*.spec.*` `test_*.py`） | **保留**这两行（含注释行） |
| 未探测到 | **删除**这两行（含注释行），并在 `docs/B/B-03-测试指南.md` 写入「建立测试后由 Agent 补 CI test 步骤」契约（含具体插入位置） |
| Go 项目 | `go test ./...` **无条件保留**（Go 内置测试，"无测试包"即 0 退出且不假装有测试，语义与 `--passWithNoTests` 不同） |

**为什么不预置 `--pass*` 开关**：那会让"零测试"判绿。**"零测试判红"本就是 vitest / jest / mocha（`No test files found`）与 pytest（退出码 5）的默认行为**，加开关反而把它变成假绿。删两行的成本远低于在 CI 里养一个假绿开关；而"该删没删 / 该补没补"由 `scripts/drift-check.mjs` 的**检查 D** 兜住（探测到测试资产但 CI 无 test 步骤 → `warning`）。

