## 门禁统一入口 job 的设计依据（已内联，此处只说明为什么）

> 目的：CI 复用与本地**同一个** `scripts/verify.*` 入口（**本地与 CI 同语义**），避免"本地能过、CI 跑的却是另一套命令"。该 job 失败即阻断合入；`level: warn` 的门禁可拆为独立非阻断 job 或仅输出报告。

- **内联而非追加**：v1.9.0 之前本模板只在文末给"追加片段"，依赖 Agent"记得追加"。实测后果是 `xiangmuces` 的 40 条门禁只有 5 条进 CI，且 CI 自建立起从未执行过任何一条门禁。**内联后不存在"忘了追加"这个失败模式。**
- **不再依赖宿主**：`make verify` / `verify.py` 这类宿主入口，只有在生成侧**确实产出**该宿主时才可使用；否则直调 `scripts/verify.*`。
- **`level: warn` 的处理**：可另起一个带 `continue-on-error: true` 的 job，或在 `verify` 中按 `--stage` 过滤后仅在报告步骤输出。

---

## 选择规则

1. 如果项目远程仓库在 **Gitee**（`git remote -v` 包含 gitee.com）→ 文件名改为 `.gitee-ci.yml`（**注意**：Gitee Go 语法与 GitHub Actions 不同，§文首规则 3 的运行时自证在 Gitee Go 上尤其必要——实测其 `build@nodejs` 插件可能不提供运行时）
2. 如果项目远程仓库在 **GitHub** → 文件放在 `.github/workflows/ci.yml`
3. 如果 CI 目录/文件已存在 → 跳过，不覆盖；但**必须**核验其中含 `scripts/verify.*` 调用，缺失则在报告中显式标注「门禁未接线 + 风险」

---

## 生成后自检（4 条，缺一视为生成失败）

| # | 检查项 | 机检方式 |
|---|--------|----------|
| 1 | 无假绿开关 | 生成物全文检索 `passWithNoTests` **命中数 = 0** |
| 2 | 门禁已接线 | 生成的 workflow 含 `scripts/verify.` 调用 |
| 3 | 运行时自证 | 每个 job 首条命令含 `command -v` + 版本打印 |
| 4 | test 步骤与探测一致 | 探测到框架/测试文件 → 有 test 步骤；未探测到 → 无 test 步骤**且** `docs/B/B-03-测试指南.md` 含补步骤契约 |
