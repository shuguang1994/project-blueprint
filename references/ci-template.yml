## Vue / React 前端项目（Vite）

```yaml
name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1 \
            || (echo "[runtime] node/npm missing, installing" \
                && (apt-get update -y && apt-get install -y nodejs npm \
                    || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
                        && apt-get install -y nodejs)))
          node -v && npm -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # ↓ test 步骤：仅在 Step 1 探测到测试框架或测试文件时生成（见文首规则 2）
      - run: pnpm test

  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1 \
            || (echo "[runtime] node/npm missing, installing" \
                && (apt-get update -y && apt-get install -y nodejs npm \
                    || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
                        && apt-get install -y nodejs)))
          node -v && npm -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify.mjs                # 统一门禁入口（本地与 CI 同语义）
      - run: node scripts/check-constitution.mjs
```

