# GitHub Actions / Gitee Go CI 模板

> Skill `project-blueprint` Step 5 参考。根据 Step 1 探测结果选择对应模板。
> 版本: v2.0 | 更新: 2026-10-14

**生成前必读（三条硬性规则，违反即视为生成失败）**：

1. **门禁 job 已内联**：每种语言的完整 workflow **已包含** `constitution` job（调用 `scripts/verify.*`）。**不再需要"追加片段"**——直接整份写入即可。若项目已有 CI 文件（跳过、不覆盖），**必须**确认其中存在对 `scripts/verify.*` 的调用；没有则在报告中显式标注「门禁未接线 + 风险」。
2. **test 步骤条件生成**：探测到测试框架**或**存在测试文件才生成 test 步骤。**禁止**使用 `--passWithNoTests`（该参数让"零测试"判绿，属假绿开关）。未生成 test 步骤时，必须在 `docs/B/B-03-测试指南.md` 写入「建立测试后由 Agent 补 CI test 步骤」契约（含具体插入位置），由 `scripts/drift-check.mjs` 的**检查 D** 机检。
3. **运行时自证**：每个 job 的**首条命令**必须以 `command -v <runtime> || <自装>` 自证运行时可用，再打印版本。理由：`xiangmuces` 实测 Gitee Go 插件未提供 `node`/`npm`，导致该 stage 5 条命令**全部** `command not found` 秒退（exit 255），流水线表面"已运行"实则从未执行过任何门禁。自证让"缺运行时"出现在**第一行**，而不是散成若干 `command not found` 被误读为门禁失败。

---

## TypeScript / NestJS 项目

```yaml
name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 运行时自证：PATH 无 node/npm 时分层自装，失败原因直指"运行时不可用"
      - name: 运行时自证
        run: |
          command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1 \
            || (echo "[runtime] node/npm missing, installing" \
                && (apt-get update -y && apt-get install -y nodejs npm \
                    || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
                        && apt-get install -y nodejs)))
          node -v && npm -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # ↓ test 步骤：仅在 Step 1 探测到测试框架或测试文件时生成（见文首规则 2）
      - run: npm test

  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时自证
        run: |
          command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1 \
            || (echo "[runtime] node/npm missing, installing" \
                && (apt-get update -y && apt-get install -y nodejs npm \
                    || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
                        && apt-get install -y nodejs)))
          node -v && npm -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: node scripts/verify.mjs                # 统一门禁入口（本地与 CI 同语义）
      - run: node scripts/check-constitution.mjs    # 宪法一致性校验（仅 error 阻断）
```

> **`npm test` 为何不加任何 `--pass*` 兜底**：vitest / jest / mocha 在**零用例**时默认即以非 0 退出（`No test files found`），pytest 零用例退出码 5——**"零测试判红"是这些运行器的默认行为**，加开关反而把它变成假绿。因此 G1 的修法是"删开关"，不是"换开关"。
> **TypeScript 项目注意**：本模板的 `npx tsc --noEmit` 要求项目**已装 typescript**。纯 JS（无 `tsconfig.json` / 无 `typescript` 依赖）项目应删掉该行。
> **`make verify` 之类宿主入口不再需要**：门禁 job 直调 `scripts/verify.*`，避免依赖"宿主是否真被生成"。

